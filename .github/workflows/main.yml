name: CI, Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean test

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java-${{ matrix.java }}
          path: '**/build/reports/'
          if-no-files-found: warn
          retention-days: 14

  build-hooks:
    name: Build WeChat Hooks
    runs-on: windows-2025
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Build wechat-hook v3
        shell: powershell
        run: |
          mkdir out
          cd wechat-hook/v3
          mkdir Out
          nuget restore Hook.sln
          msbuild Hook.sln /p:Configuration=Release

          echo "# Hook endpoint URL" >> Out/config.properties
          echo "api_url=http://127.0.0.1:62233/api/hook/receive" >> Out/config.properties

          cp LICENSE Out/LICENSE
          cd Out
          Compress-Archive -Path '*' -DestinationPath '../../../out/WeChat-Hook-v3.zip'
          cd ../../../

      - name: Build wechat-hook v4
        shell: powershell
        run: |
          cd wechat-hook/v4
          mkdir Out
          cmd /c build.cmd

          echo "# WSXPay Hook configuration" >> Out/config.properties
          echo "api_url=http://127.0.0.1:62233/api/hook/receive" >> Out/config.properties
          echo "wechat_key=" >> Out/config.properties
          echo "database_folder=auto" >> Out/config.properties

          cp LICENSE Out/LICENSE
          cd Out
          Compress-Archive -Path '*' -DestinationPath '../../../out/WeChat-Hook-v4.zip'
          cd ../../../

      - name: Upload hook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-artifacts
          path: out/WeChat-Hook-*.zip
          if-no-files-found: error
          retention-days: 14

  build-plugin:
    name: Build Plugin Artifact
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "${TAG_NAME}" == v* ]]; then
            BUILD_VERSION="${TAG_NAME#v}"
          else
            BUILD_VERSION="${TAG_NAME}"
          fi
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved build version: ${BUILD_VERSION}"

      - name: Build plugin with backend
        run: ./gradlew --no-daemon clean :plugin:bukkit:with-backend:build -Pver="${{ steps.meta.outputs.build_version }}"

      - name: Verify expected artifact
        shell: bash
        run: |
          shopt -s nullglob
          plugin=(out/WebShopX-Payments-*-full.jar)
          if (( ${#plugin[@]} == 0 )); then
            echo "::error::Missing plugin artifact under out/."
            exit 1
          fi

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: out/WebShopX-Payments-*-full.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release to Current Repository
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-hooks, build-plugin]
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifacts
          path: out

      - name: Download hook artifacts
        uses: actions/download-artifact@v4
        with:
          name: hook-artifacts
          path: out

      - name: Resolve release type
        id: meta
        shell: bash
        run: |
          if [[ "${TAG_NAME}" == v* ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          plugin=(out/WebShopX-Payments-*-full.jar)
          hook3=(out/WeChat-Hook-v3.zip)
          hook4=(out/WeChat-Hook-v4.zip)

          {
            echo "## Release Assets"
            echo
            echo "| Type | File |"
            echo "| ---- | ---- |"
            if (( ${#plugin[@]} > 0 )); then
              p="$(basename "${plugin[0]}")"
              echo "| Plugin (with backend) | [${p}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${p}) |"
            fi
            if (( ${#hook3[@]} > 0 )); then
              h3="$(basename "${hook3[0]}")"
              echo "| WeChat Hook v3 | [${h3}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${h3}) |"
            fi
            if (( ${#hook4[@]} > 0 )); then
              h4="$(basename "${hook4[0]}")"
              echo "| WeChat Hook v4 | [${h4}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${h4}) |"
            fi
          } > release-notes.md

      - name: Publish release to current repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts found under out/."
            exit 1
          fi

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists in ${GITHUB_REPOSITORY}, updating assets..."
            gh release upload "${TAG_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            if [[ "${{ steps.meta.outputs.is_prerelease }}" == "true" ]]; then
              gh release edit "${TAG_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Pre-release ${TAG_NAME}" \
                --notes-file release-notes.md \
                --prerelease
            else
              gh release edit "${TAG_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes.md
            fi
          else
            if [[ "${{ steps.meta.outputs.is_prerelease }}" == "true" ]]; then
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "Pre-release ${TAG_NAME}" \
                --notes-file release-notes.md \
                --prerelease
            else
              gh release create "${TAG_NAME}" "${files[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Release ${TAG_NAME}" \
                --notes-file release-notes.md
            fi
          fi


  publish-modrinth:
    name: Publish Plugin Artifact to Modrinth
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'dev')
    runs-on: ubuntu-latest
    needs: [build-plugin, release]
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifacts
          path: out

      - name: Publish to Modrinth
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [[ -z "${MODRINTH_TOKEN:-}" ]]; then
            echo "::warning::Missing secret MODRINTH_TOKEN, skipping Modrinth publish."
            exit 0
          fi
          if [[ -z "${MODRINTH_PROJECT_ID:-}" ]]; then
            echo "::warning::Missing repository variable MODRINTH_PROJECT_ID, skipping Modrinth publish."
            exit 0
          fi

          plugin=(out/WebShopX-Payments-*-full.jar)
          if (( ${#plugin[@]} == 0 )); then
            echo "::error::Missing plugin artifact required for Modrinth publish."
            exit 1
          fi

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "${TAG_NAME}" == v* ]]; then
            BASE_VERSION="${TAG_NAME#v}"
            VERSION_TYPE="release"
          else
            BASE_VERSION="${TAG_NAME}"
            VERSION_TYPE="beta"
          fi

          changelog=$(
            cat <<EOF
          由 GitHub 标签 \`${TAG_NAME}\` 自动发布。

          完整更新信息请查看 GitHub Release 页面：
          https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}
          EOF
          )

          game_versions_json=$(
            curl -sSf "https://api.modrinth.com/v2/tag/game_version" \
              | jq -c '
                  [ .[]
                    | select(.version_type == "release")
                    | .version
                    | select(test("^\\d+\\.\\d+(\\.\\d+)?$"))
                  ]
                  | unique
                  | sort_by(split(".") | map(tonumber))
                '
          )

          payload=$(
            jq -cn \
              --arg project_id "${MODRINTH_PROJECT_ID}" \
              --arg version_number "${BASE_VERSION}" \
              --arg version_title "${BASE_VERSION} (with-backend)" \
              --arg changelog "${changelog}" \
              --arg version_type "${VERSION_TYPE}" \
              --argjson game_versions "${game_versions_json}" \
              '{
                project_id: $project_id,
                version_number: $version_number,
                name: $version_title,
                changelog: $changelog,
                version_type: $version_type,
                loaders: ["paper","purpur","spigot","bukkit","folia"],
                game_versions: $game_versions,
                dependencies: [],
                featured: false,
                status: "listed",
                file_parts: ["file"]
              }'
          )

          response_file="$(mktemp)"
          http_code=$(
            curl -sS -o "${response_file}" -w "%{http_code}" -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -H "User-Agent: ${GITHUB_REPOSITORY}/actions" \
              -F "data=${payload}" \
              -F "file=@${plugin[0]};type=application/java-archive"
          )

          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Modrinth upload failed with HTTP ${http_code}."
            cat "${response_file}"
            rm -f "${response_file}"
            exit 1
          fi
          rm -f "${response_file}"

